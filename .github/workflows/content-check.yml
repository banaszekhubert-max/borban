name: Kontrola materiału
on:
  push:
    paths: ["content/**", "tools/**"]
  pull_request:
    paths: ["content/**", "tools/**"]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 tools/validate_pack.py content/library/*.json
