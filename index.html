<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>BorBan</title>
<meta name="theme-color" content="#4F46E5">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="BorBan">
<meta name="robots" content="noindex">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@600;700&display=swap">
<style>
/* Layout: one phone-width column, sticky top bar, fixed bottom tabs; study mode is a full-screen sheet.
   Identity: notebook paper + ink blue + highlighter yellow (zakreślacz) for answers and wins. */
:root{
  --bg:#F3F5FA; --surface:#FFFFFF; --sunk:#E8ECF5; --ink:#18213A; --muted:#58617C; --line:#D8DDEA;
  --primary:#2448D8; --primary-ink:#FFFFFF; --primary-soft:#DCE3FF;
  --hl:#FFE15A; --on-hl:#18213A;
  --good:#16865A; --good-soft:#D6F2E5; --warn:#B7790A; --warn-soft:#FCEFCF; --bad:#C93A3A; --bad-soft:#F9DEDE;
  --s-blue:#2448D8; --s-red:#C9443A; --s-green:#178A5B; --s-purple:#7A45C9; --s-orange:#C8690E; --s-teal:#0F7E8C;
  --f-display:"Bricolage Grotesque", "Avenir Next", system-ui, sans-serif;
  --f-body:"Atkinson Hyperlegible", system-ui, -apple-system, "Segoe UI", sans-serif;
  --r:16px; --r-sm:10px;
  --shadow:0 1px 2px rgba(24,33,58,.06), 0 4px 14px rgba(24,33,58,.06);
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0E1322; --surface:#171E33; --sunk:#10172A; --ink:#E8ECF7; --muted:#9AA3C0; --line:#28314E;
  --primary:#7E96FF; --primary-ink:#0E1322; --primary-soft:#232E58;
  --hl:#F2D24A; --on-hl:#18213A;
  --good:#4CC995; --good-soft:#163628; --warn:#E6B24A; --warn-soft:#3A2E12; --bad:#F07A7A; --bad-soft:#3C1E22;
  --s-blue:#7E96FF; --s-red:#F0857C; --s-green:#4CC995; --s-purple:#B58BF2; --s-orange:#F0A55C; --s-teal:#4FC3D0;
  --shadow:none; color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0E1322; --surface:#171E33; --sunk:#10172A; --ink:#E8ECF7; --muted:#9AA3C0; --line:#28314E;
  --primary:#7E96FF; --primary-ink:#0E1322; --primary-soft:#232E58;
  --hl:#F2D24A; --on-hl:#18213A;
  --good:#4CC995; --good-soft:#163628; --warn:#E6B24A; --warn-soft:#3A2E12; --bad:#F07A7A; --bad-soft:#3C1E22;
  --s-blue:#7E96FF; --s-red:#F0857C; --s-green:#4CC995; --s-purple:#B58BF2; --s-orange:#F0A55C; --s-teal:#4FC3D0;
  --shadow:none; color-scheme:dark;
}
/* Motyw „Szkoła średnia” (domyślny od 25.10): grafit + indygo, Inter / Space Grotesk; błąd bursztynowy, nigdy czerwony */
:root[data-skin="sredni"]{
  --bg:#F4F5F7; --surface:#FFFFFF; --sunk:#EEF0F4; --ink:#0F172A; --muted:#475569; --line:#E2E8F0;
  --primary:#4F46E5; --primary-ink:#FFFFFF; --primary-soft:#E0E7FF;
  --hl:#FDE68A; --on-hl:#0F172A;
  --good:#0F766E; --good-soft:#CCFBF1; --warn:#B45309; --warn-soft:#FEF3C7; --bad:#B45309; --bad-soft:#FEF3C7;
  --f-display:"Space Grotesk", system-ui, sans-serif; --f-body:Inter, system-ui, -apple-system, "Segoe UI", sans-serif;
  --r:18px; --r-sm:12px; --shadow:none;
}
@media (prefers-color-scheme: dark){ :root[data-skin="sredni"]:not([data-theme="light"]){
  --bg:#0B1220; --surface:#131C2E; --sunk:#0F1726; --ink:#F1F5F9; --muted:#94A3B8; --line:#24314A;
  --primary:#818CF8; --primary-ink:#0B1220; --primary-soft:#262B5A; --hl:#FDE68A; --on-hl:#0B1220;
  --good:#5EEAD4; --good-soft:#123A36; --warn:#FDBA74; --warn-soft:#3A2A12; --bad:#FDBA74; --bad-soft:#3A2A12;
}}
:root[data-skin="sredni"][data-theme="dark"]{
  --bg:#0B1220; --surface:#131C2E; --sunk:#0F1726; --ink:#F1F5F9; --muted:#94A3B8; --line:#24314A;
  --primary:#818CF8; --primary-ink:#0B1220; --primary-soft:#262B5A; --hl:#FDE68A; --on-hl:#0B1220;
  --good:#5EEAD4; --good-soft:#123A36; --warn:#FDBA74; --warn-soft:#3A2A12; --bad:#FDBA74; --bad-soft:#3A2A12;
}
[data-skin="sredni"] h1,[data-skin="sredni"] h2{letter-spacing:-.02em}
[data-skin="sredni"] .top{background:var(--surface)}
[data-skin="sredni"] .brand span{background:none}
[data-skin="sredni"] .brand::after{content:"_"; color:var(--primary)}
[data-skin="sredni"] .panel.hero{background:#0F172A; color:#FFFFFF}
[data-skin="sredni"] .panel.hero .muted{color:#CBD5E1}
[data-skin="sredni"] .hero .btn.primary{background:#4F46E5; color:#FFFFFF}
[data-skin="sredni"] .grade{border-width:1px; border-radius:16px}
[data-skin="sredni"] .btn{border-radius:14px}
[data-skin="sredni"] .chip,[data-skin="sredni"] .pill{border-radius:999px}
[data-skin="sredni"] input,[data-skin="sredni"] select,[data-skin="sredni"] textarea{border-radius:12px}
[data-skin="sredni"] .grade.g1{border-color:var(--line); color:var(--ink)}
[data-skin="sredni"] .grade.g2{background:var(--primary); border-color:var(--primary); color:var(--primary-ink)}
[data-skin="sredni"] .grade.g2 small{color:color-mix(in srgb, var(--primary-ink) 80%, transparent)}
[data-skin="sredni"] .grade.suggest{box-shadow:0 0 0 4px color-mix(in srgb, var(--primary) 30%, transparent)}
[data-skin="sredni"] .grade.g0.suggest{box-shadow:0 0 0 4px color-mix(in srgb, var(--warn) 30%, transparent)}
html,body{height:100%}
body{background:var(--bg); color:var(--ink); font-family:var(--f-body); font-size:16px; line-height:1.45; -webkit-tap-highlight-color:transparent}
*{box-sizing:border-box}
button,input,select,textarea{font:inherit; color:inherit}
h1,h2,h3{font-family:var(--f-display); margin:0; text-wrap:balance; letter-spacing:-.01em}
h1{font-size:1.75rem; font-weight:800}
h2{font-size:1.2rem; font-weight:800}
h3{font-size:1rem; font-weight:600}
p{margin:0}
.wrap{max-width:560px; margin:0 auto; padding-left:max(16px, env(safe-area-inset-left,0px)); padding-right:max(16px, env(safe-area-inset-right,0px))}

/* top bar */
.top{position:sticky; top:env(safe-area-inset-top,0px); z-index:5; background:color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter:blur(10px); border-bottom:1px solid var(--line)}
.top .wrap{display:flex; align-items:center; gap:10px; padding-block:10px}
.brand{font-family:var(--f-display); font-weight:800; font-size:1.3rem; margin-right:auto; position:relative}
.brand span{background:linear-gradient(transparent 58%, var(--hl) 58%, var(--hl) 92%, transparent 92%); color:var(--ink)}
.pill{display:inline-flex; align-items:center; gap:5px; padding:5px 10px; border-radius:999px; background:var(--surface); border:1px solid var(--line); font-weight:700; font-variant-numeric:tabular-nums; font-size:.9rem; white-space:nowrap}
.pill svg{width:16px; height:16px}
.pill.flame svg{color:#E8590C}
.pill.star svg{color:var(--warn)}
.banner{font-size:.85rem; padding:8px 12px; border-radius:var(--r-sm); background:var(--warn-soft); color:var(--ink); border:1px solid color-mix(in srgb, var(--warn) 30%, transparent)}

main{padding-block:16px 110px}
.stack{display:flex; flex-direction:column; gap:14px}
.row{display:flex; gap:10px; align-items:center; flex-wrap:wrap}
.muted{color:var(--muted)}
.small{font-size:.85rem}
.eyebrow{font-size:.75rem; text-transform:uppercase; letter-spacing:.08em; color:var(--muted); font-weight:700}
.panel{background:var(--surface); border:1px solid var(--line); border-radius:var(--r); padding:16px; box-shadow:var(--shadow); min-width:0}
.panel.hero{background:var(--primary); color:var(--primary-ink); border-color:transparent}
.panel.hero .muted{color:color-mix(in srgb, var(--primary-ink) 78%, transparent)}
.panel.test{border:2px solid var(--hl); background:color-mix(in srgb, var(--hl) 14%, var(--surface))}

.btn{display:inline-flex; align-items:center; justify-content:center; gap:8px; min-height:44px; padding:10px 18px; border-radius:12px; border:1px solid var(--line); background:var(--surface); font-weight:700; cursor:pointer; text-decoration:none}
.btn:hover{border-color:var(--primary)}
.btn:focus-visible,.tab:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,summary:focus-visible{outline:3px solid var(--hl); outline-offset:2px}
.btn.primary{background:var(--primary); color:var(--primary-ink); border-color:transparent}
.btn.big{min-height:56px; font-size:1.1rem; width:100%; border-radius:14px}
.hero .btn.primary{background:var(--hl); color:var(--on-hl)}
.btn.ghost{background:transparent; border-color:transparent}
.btn.danger{color:var(--bad)}
.btn:disabled{opacity:.5; cursor:default}
.btn.sm{min-height:36px; padding:6px 12px; font-size:.9rem}

/* stat tiles */
.tiles{display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:10px}
@media (min-width:480px){ .tiles.four{grid-template-columns:repeat(4,minmax(0,1fr))} }
.tile{background:var(--surface); border:1px solid var(--line); border-radius:var(--r-sm); padding:12px}
.tile b{display:block; font-family:var(--f-display); font-size:1.5rem; font-weight:800; font-variant-numeric:tabular-nums; line-height:1.1}
.tile span{font-size:.8rem; color:var(--muted)}

/* chips & status */
.chip{display:inline-flex; align-items:center; gap:6px; padding:3px 9px; border-radius:999px; font-size:.78rem; font-weight:700; background:var(--sunk); color:var(--ink); white-space:nowrap}
.chip.todo{background:var(--sunk); color:var(--muted)}
.chip.doing{background:var(--warn-soft); color:var(--warn)}
.chip.done{background:var(--good-soft); color:var(--good)}
.chip.here{background:var(--hl); color:var(--on-hl)}
.chip.bad{background:var(--bad-soft); color:var(--bad)}
.dot{width:10px; height:10px; border-radius:50%; background:var(--c, var(--primary)); flex:none}
.subjtabs{display:flex; gap:8px; overflow-x:auto; padding-bottom:4px}
.subjtab{border:1px solid var(--line); background:var(--surface); border-radius:999px; padding:8px 14px; font-weight:700; cursor:pointer; white-space:nowrap; display:inline-flex; gap:8px; align-items:center}
.subjtab[aria-pressed="true"]{border-color:var(--c); box-shadow:inset 0 0 0 1px var(--c)}

/* map path */
.path{position:relative; display:flex; flex-direction:column; gap:6px; padding-left:4px}
.path::before{content:""; position:absolute; left:31px; top:30px; bottom:30px; width:4px; border-radius:2px; background:var(--line)}
.unit{position:relative; display:grid; grid-template-columns:58px minmax(0,1fr); gap:12px; align-items:center; padding:8px 8px 8px 0; border-radius:var(--r); cursor:pointer; background:none; border:0; text-align:left; width:100%}
.unit:hover .ring{transform:scale(1.04)}
.unit.locked{opacity:.55}
.ring{--p:0; width:56px; height:56px; border-radius:50%; background:conic-gradient(var(--c) calc(var(--p)*1%), var(--line) 0); display:grid; place-items:center; transition:transform .15s; position:relative; z-index:1}
.ring i{width:42px; height:42px; border-radius:50%; background:var(--surface); display:grid; place-items:center; font-style:normal; font-weight:800; font-size:.8rem; font-variant-numeric:tabular-nums}
.ring.full i{background:var(--c); color:var(--surface)}
.ring.full i svg{width:22px; height:22px}
.unit .t{font-weight:700}
.unitcards{margin:0 0 8px 70px; display:flex; flex-direction:column; gap:6px}
.mini{display:flex; gap:8px; align-items:flex-start; font-size:.9rem; padding:8px 10px; border-radius:var(--r-sm); background:var(--sunk)}
.mini .q{flex:1; min-width:0}
.lvl{display:inline-flex; gap:3px; flex:none; padding-top:5px}
.lvl i{width:8px; height:8px; border-radius:2px; background:var(--line)}
.lvl i.on{background:var(--good)}

/* bars */
.bar{height:10px; border-radius:6px; background:var(--sunk); overflow:hidden}
.bar > i{display:block; height:100%; background:var(--c, var(--primary)); border-radius:6px}
.bar.dual{position:relative}
.bar.dual > b{position:absolute; left:0; top:0; height:100%; border-radius:6px; background:color-mix(in srgb, var(--c) 35%, var(--surface))}
.bar.dual > i{position:relative}
.urow{display:grid; grid-template-columns:minmax(0,1fr) 92px 42px; gap:10px; align-items:center; font-size:.9rem}
.urow .n{text-align:right; font-variant-numeric:tabular-nums; font-weight:700}
.chart text{fill:var(--muted); font-size:11px; font-family:var(--f-body)}

/* plan */
.week{display:grid; gap:8px}
.day{display:grid; grid-template-columns:44px minmax(0,1fr) auto; gap:10px; align-items:center; padding:10px 12px; border-radius:var(--r-sm); background:var(--surface); border:1px solid var(--line)}
.day.today{border:2px solid var(--primary)}
.day .d{font-family:var(--f-display); font-weight:800; font-size:1.05rem}
.check{width:26px; height:26px; border-radius:50%; display:grid; place-items:center; border:2px solid var(--line); color:transparent}
.check.on{background:var(--good); border-color:var(--good); color:#fff}
.check svg{width:16px; height:16px}
.steps{display:flex; gap:4px; margin-top:6px}
.steps span{flex:var(--w); height:6px; border-radius:3px; background:var(--c)}

/* forms */
label.f{display:flex; flex-direction:column; gap:4px; font-weight:700; font-size:.9rem}
label.f small{font-weight:400; color:var(--muted)}
input[type=text],input[type=date],input[type=number],select,textarea{width:100%; min-height:44px; padding:10px 12px; border-radius:10px; border:1px solid var(--line); background:var(--bg); font-weight:400}
textarea{min-height:90px; resize:vertical}
details.adm{background:var(--surface); border:1px solid var(--line); border-radius:var(--r)}
details.adm > summary{padding:14px 16px; cursor:pointer; font-family:var(--f-display); font-weight:800; font-size:1.05rem; list-style:none; display:flex; justify-content:space-between; gap:10px}
details.adm > summary::after{content:"+"; font-weight:400; color:var(--muted)}
details.adm[open] > summary::after{content:"−"}
details.adm > .body{padding:0 16px 16px; display:flex; flex-direction:column; gap:12px}
.list{display:flex; flex-direction:column; gap:6px}
.li{display:flex; gap:10px; align-items:center; justify-content:space-between; padding:8px 10px; border-radius:var(--r-sm); background:var(--sunk); font-size:.92rem}
.li > div{min-width:0; overflow-wrap:anywhere}
.prop{display:grid; grid-template-columns:24px minmax(0,1fr); gap:8px; align-items:start; padding:10px; border-radius:var(--r-sm); background:var(--sunk)}
.prop .fields{display:flex; flex-direction:column; gap:6px}
.prop input[type=text]{min-height:38px; padding:6px 10px}
.unclear{border-left:4px solid var(--warn); padding:8px 12px; background:var(--warn-soft); border-radius:6px; font-size:.9rem}
.empty{padding:22px 16px; text-align:center; border:2px dashed var(--line); border-radius:var(--r); color:var(--muted)}

/* tabs */
.tabs{position:fixed; left:0; right:0; bottom:0; z-index:6; background:var(--surface); border-top:1px solid var(--line); padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs .wrap{display:flex; justify-content:space-around}
.tab{flex:1; display:flex; flex-direction:column; align-items:center; gap:2px; padding:8px 4px 10px; background:none; border:0; cursor:pointer; color:var(--muted); font-size:.75rem; font-weight:700}
.tab svg{width:24px; height:24px}
.tab[aria-current="page"]{color:var(--primary)}

/* study sheet */
.sheet{position:fixed; inset:0; z-index:20; background:var(--bg); overflow-y:auto; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px)}
.sheet .wrap{min-height:100%; display:flex; flex-direction:column; gap:16px; padding-block:12px 24px}
.sbar{display:flex; align-items:center; gap:12px}
.sbar .bar{flex:1; height:12px}
.sbar .bar > i{background:var(--good); transition:width .3s}
.iconbtn{width:44px; height:44px; border-radius:12px; border:1px solid var(--line); background:var(--surface); display:grid; place-items:center; cursor:pointer; flex:none}
.iconbtn svg{width:20px; height:20px}
.fc{background:var(--surface); border:1px solid var(--line); border-radius:20px; padding:22px 20px; box-shadow:var(--shadow); display:flex; flex-direction:column; gap:14px; min-height:220px}
.fc .meta{display:flex; gap:8px; align-items:center; flex-wrap:wrap; font-size:.85rem; color:var(--muted)}
.fc .front{font-family:var(--f-display); font-weight:600; font-size:1.45rem; line-height:1.3; overflow-wrap:anywhere}
.fc img{border-radius:12px; border:1px solid var(--line); background:#fff; width:100%}
.fc{-webkit-user-select:none; user-select:none; -webkit-touch-callout:none}
.pic{--ink:#1d2433;--mute:#6b7385;--line:#d9dde8;--soft:#eef1f8;--card:#fff;--chem:#e0573a;--fiz:#2f7de1;--mat:#7a4fd6;--inf:#159a72;--p:#e0573a;--n:#8a93a6;--e:#2f7de1;--hl:#ffd54a;--pol:#c2410c;--his:#a16207;--gold:#f2b705;--sea:#2f7de1;--red:#d64545;--grn:#159a72;--vio:#7a4fd6;--dark:#3b3f4a;--acc:#c2410c;--bad:#d64545;--ok:#159a72;--fig:#7a4fd6;--lit:#2f7de1;
  background:var(--soft); border:1px solid var(--line); border-radius:14px; padding:6px; color:var(--ink)}
.pic svg{width:100%; height:auto; max-height:260px; display:block}
.pic text{fill:var(--ink); font:12px system-ui,sans-serif} .pic .m{fill:var(--mute)} .pic .b{font-weight:700} .pic .c{text-anchor:middle} .pic .s{font-size:10px}
.pic .line{stroke:var(--ink); stroke-width:2; fill:none} .pic .thin{stroke:var(--mute); stroke-width:1.2; fill:none}
.pic.sm{max-width:180px; align-self:center}
.pic .spin{transform-origin:160px 95px; animation:pspin 8s linear infinite} .pic .spin2{transform-origin:160px 95px; animation:pspin 14s linear infinite reverse}
.pic .car{animation:pdrive 4s linear infinite} .pic .dot{animation:pdot 4s linear infinite}
@keyframes pspin{to{transform:rotate(360deg)}} @keyframes pdrive{from{transform:translateX(0)}to{transform:translateX(200px)}} @keyframes pdot{from{transform:translate(0,0)}to{transform:translate(120px,-80px)}}
@media (prefers-reduced-motion:reduce){.pic .spin,.pic .spin2,.pic .car,.pic .dot{animation:none}}
.who{font-size:.85rem; color:var(--muted); margin-top:-8px}
#hdrBook[aria-pressed="true"]{background:var(--primary-soft)}
.zbody{margin-top:8px} .zbody .zh{font-weight:700; margin:10px 0 4px} .zbody .zp,.zbody .zli{margin:2px 0; font-size:.95rem}
.ztbl{border-collapse:collapse; font-size:.85rem; margin:6px 0} .ztbl th,.ztbl td{border:1px solid var(--line); padding:4px 6px; text-align:left; vertical-align:top} .ztbl th{background:var(--primary-soft)}
.steps{display:flex; flex-direction:column; gap:8px}
.st{border-radius:12px; padding:10px 12px; border-left:5px solid; font-size:.95rem; line-height:1.4}
.st b.h{display:block; font-size:.7rem; text-transform:uppercase; letter-spacing:.05em; opacity:.75; margin-bottom:2px}
.st1{border-color:#2f7de1; background:rgba(47,125,225,.09)} .st2{border-color:#8a93a6; background:rgba(138,147,166,.12)} .st4{border-color:#159a72; background:rgba(21,154,114,.1)}
.st .tpl{font-size:.8rem; opacity:.8; margin-top:4px}
.gap{display:inline-block; min-width:4.5em; border-bottom:3px solid var(--primary); margin:0 2px}
mark{background:var(--hl); color:var(--on-hl); padding:0 .2em; border-radius:4px}
.answer{border-top:2px dashed var(--line); padding-top:14px; font-size:1.15rem; overflow-wrap:anywhere}
.yours{font-size:.9rem; padding:8px 12px; border-radius:10px; background:var(--sunk)}
.yours.match{background:var(--good-soft)}
.grades{display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:8px}
.grade{min-height:64px; border-radius:14px; border:2px solid var(--line); background:var(--surface); font-weight:800; cursor:pointer; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px; padding:6px}
.yours.miss{background:var(--warn-soft); border-left:4px solid var(--warn); color:var(--ink)}
.mathpad{display:grid; grid-template-columns:repeat(5, minmax(0, 1fr)); gap:6px; user-select:none; -webkit-user-select:none}
.mathpad .key{min-height:46px; border-radius:12px; border:1px solid var(--line); background:var(--surface); color:var(--ink); font-size:1.15rem; font-weight:600; cursor:pointer; font-variant-numeric:tabular-nums; touch-action:manipulation}
.mathpad .key:active{background:var(--sunk)}

.mathpad .key.on{background:var(--primary); border-color:var(--primary); color:var(--primary-ink)}
.grade small{font-weight:400; font-size:.75rem; color:var(--muted)}
.grade.g0{border-color:var(--bad); color:var(--bad)}

/* kafelki zadań */

.task{display:flex; gap:10px; align-items:flex-start; text-align:left; padding:12px; border-radius:var(--r-sm); border:2px solid var(--line); background:var(--surface); min-height:76px; font:inherit; color:inherit; min-width:0}

<script>

const SUBJ_COLORS = ["blue","red","green","purple","orange","teal"];

const pad = n => String(n).padStart(2,"0");
const dkey = (d = new Date()) => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parseKey = k => { const [y,m,d] = k.split("-").map(Number); return new Date(y, m-1, d); };

const daysBetween = (a, b) => Math.round((parseKey(b) - parseKey(a)) / 864e5);
const dow = k => parseKey(k).getDay(); // 0 = niedziela
const mondayOf = k => addDays(k, -((dow(k)+6)%7));
const TODAY = () => dkey();
const DNI = ["niedziela","poniedziałek","wtorek","środa","czwartek","piątek","sobota"];
const DNI_KR = ["Nd","Pn","Wt","Śr","Czw","Pt","Sob"];
const MIES = ["stycznia","lutego","marca","kwietnia","maja","czerwca","lipca","sierpnia","września","października","listopada","grudnia"];

const fmtMin = ms => { const m = Math.round(ms/60000); return m < 60 ? `${m} min` : `${Math.floor(m/60)} h ${m%60} min`; };
const plural = (n, one, few, many) => n === 1 ? one : (n%10>=2 && n%10<=4 && (n%100<10 || n%100>=20)) ? few : many;
const uid = p => p + Date.now().toString(36) + Math.random().toString(36).slice(2,6);
function toast(msg){ const t = $("#toast"); t.textContent = msg; t.hidden = false; clearTimeout(toast.t); toast.t = setTimeout(()=> t.hidden = true, 2600); }

/* ---------- metody: stałe ---------- */
const MASTERY_RUN = 3;        // karta opanowana: 3 poprawne odpowiedzi z rzędu (zła odpowiedź zeruje licznik), bez wymogu odstępu dni
const UNIT_DONE = 0.9;        // dział opanowany: 90% kart opanowanych
const SESSION_MAX = 30;       // ok. 15–20 min przy spokojnym tempie
const TEST_DAYS = [7,5,3,1];  // sesje przed sprawdzianem
const PLAN = { // 0 = niedziela
  1:{time:"20:00", note:"po treningu", block:true},
  2:{time:"19:00", block:true},
  3:{time:"20:00", note:"po treningu", block:true},
  4:{time:"19:00", block:true},
  5:{block:false}, 6:{block:false},
  0:{woop:true}
};
const BLOCK_STEPS = [["Plan sesji",5,"var(--muted)"],["Odpytywanie z dzisiejszych lekcji",25,"var(--primary)"],["Przerwa",5,"var(--line)"],["Powtórka fiszek",25,"var(--good)"]];

/* ---------- stan ---------- */
const COLS = ["meta","subjects","units","cards","progress","sessions","tests","woop","flags","notes","confirmations"];
const S = Object.fromEntries(COLS.map(c => [c, {}]));
const role = { canEdit:false, canWrite:true, isOwner:false, preview:false, mode:"…" };
let caps = { sample:null, assets:null, imagesOk:false };
let tab = "dzis";
let mapSubject = null, openUnit = null;
const drafts = {};
let store = null;

/* ---------- algorytm powtórek (SM-2, ostrożniejsze odstępy) ---------- */
function grade(prev, g, today){
  const p = Object.assign({ease:2.3, interval:0, reps:0, run:0, lastOk:null, lapses:0, seen:0, hist:[]}, prev || {});
  const base = runOf(prev);                       // dobre odpowiedzi z rzędu przed tą odpowiedzią
  const wasMastered = base >= MASTERY_RUN;
  const early = wasMastered && p.due && today < p.due; // dodatkowa powtórka przed terminem nie przesuwa planu
  p.seen++; p.last = today; p.at = Date.now(); p.v = 2;
  p.hist = [...(p.hist||[]), [today, g]].slice(-12);
  if (g === 0){
    p.lapses++; p.reps = 0; p.interval = 0; p.run = 0; p.lastOk = null;
    p.ease = Math.max(1.3, +(p.ease - 0.2).toFixed(2));
    p.due = today;
    return p;
  }
  p.run = base + 1; p.lastOk = today;
  if (g === 1) p.ease = Math.max(1.3, +(p.ease - 0.15).toFixed(2));
  if (p.run < MASTERY_RUN){ p.reps = 0; p.interval = 0; p.due = today; }            // jeszcze nie opanowana: wraca dziś
  else if (!wasMastered){ p.reps = 1; p.interval = 1; p.due = addDays(today, 1); }    // właśnie opanowana: pierwsza powtórka jutro
  else if (!early){                                                                   // powtórki opanowanej karty: 1, 2, 4, potem × łatwość
    p.interval = g === 1 ? Math.max(p.interval + 1, Math.round(Math.max(p.interval, 1) * 1.2))
      : p.reps <= 1 ? 2 : p.reps === 2 ? 4 : Math.round(Math.max(p.interval, 1) * p.ease);
    p.interval = Math.min(p.interval, 90); p.reps++; p.due = addDays(today, p.interval);
  }
  return p;
}
// Dobre odpowiedzi z rzędu. Zapisy od 25.10 (v:2) trzymają licznik w run; starsze liczymy z historii.
function runOf(p){ if (!p) return 0; if (p.v === 2) return p.run || 0; const h = p.hist || []; if (!h.length) return p.run || 0;
  let n = 0; for (let i = h.length - 1; i >= 0 && h[i][1] > 0; i--) n++; return Math.max(n, h[h.length-1][1] > 0 ? (p.run || 0) : 0); }
const isMastered = cid => runOf(S.progress[cid]) >= MASTERY_RUN;

/* ---------- wyliczenia ---------- */
const sortedSubjects = () => Object.entries(S.subjects).sort((a,b) => (a[1].order||0)-(b[1].order||0));
const unitsOf = sid => Object.entries(S.units).filter(([,u]) => u.subjectId === sid).sort((a,b) => (a[1].order||0)-(b[1].order||0));
const cardsOf = uid_ => Object.entries(S.cards).filter(([,c]) => c.unitId === uid_);
const cardLevel = cid => Math.min(MASTERY_RUN, runOf(S.progress[cid]));
function unitStats(u){
  const cs = cardsOf(u); let m = 0, seen = 0, lapses = 0;
  cs.forEach(([id]) => { const p = S.progress[id]; if (p){ seen++; lapses += p.lapses||0; } if (isMastered(id)) m++; });
  const pct = cs.length ? m / cs.length : 0;
  const levels = cs.reduce((a,[id]) => a + cardLevel(id), 0);
  const prog = cs.length ? levels / (cs.length * MASTERY_RUN) : 0;
  const status = !seen ? "todo" : pct >= UNIT_DONE ? "done" : "doing";
  return {total: cs.length, mastered: m, seen, lapses, pct, prog, levels, maxLevels: cs.length * MASTERY_RUN, status};
}
const STATUS_TXT = {todo:"nie zaczęty", doing:"w trakcie", done:"opanowany"};
function eligibleUnit(uid_){
  const u = S.units[uid_]; if (!u) return false;
  const s = S.subjects[u.subjectId]; const cur = s && S.units[s.current];
  return !cur || (u.order||0) <= (cur.order||0);
}
function sessionsOn(k){ return Object.values(S.sessions).filter(s => s.date === k); }
function activeMsOn(k){ return sessionsOn(k).reduce((a,s) => a + (s.activeMs||0), 0); }
function learnedOn(k){ return answeredOn(k) >= 5 || activeMsOn(k) >= 180000; }
function streak(){
  // Dzień liczy się, gdy była nauka. Jeden wolny dzień w tygodniu nie przerywa serii.
  const t = TODAY(); let k = learnedOn(t) ? t : addDays(t, -1); let n = 0, gap = 0; const used = new Set();
  for (let i = 0; i < 400; i++){
    if (learnedOn(k)){ n++; gap = 0; }
    else { const w = mondayOf(k); if (used.has(w) || gap >= 1) break; used.add(w); gap++; }
    k = addDays(k, -1);
  }
  return n;
}
function pointsInWeek(mon){ return Object.values(S.sessions).filter(s => s.date >= mon && s.date <= addDays(mon,6)).reduce((a,s) => a + (s.points||0), 0); }
function upcomingTests(){
  const t = TODAY();
  return Object.entries(S.tests).filter(([,x]) => x.date >= t).sort((a,b) => a[1].date.localeCompare(b[1].date));
}
function testCards(test){ return Object.entries(S.cards).filter(([,c]) => (test.unitIds||[]).includes(c.unitId)).map(([id]) => id); }
function readiness(test){ const ids = testCards(test); return ids.length ? ids.filter(isMastered).length / ids.length : 0; }
/* ---------- tempo do sprawdzianów: ile trzeba dziennie, żeby zdążyć ---------- */
// Karta jest opanowana po 3 poprawnych odpowiedziach z rzędu. Nowe karty warto zacząć najpóźniej NEW_LEAD dni
// przed sprawdzianem, żeby było kiedy je powtórzyć (powtórki w kolejne dni trzymają się w pamięci lepiej niż w jeden wieczór).
const NEW_LEAD = 3;
function secPerAnswer(){
  const ss = Object.values(S.sessions).filter(s => (s.n||0) >= 5 && s.activeMs);
  const n = ss.reduce((a,s) => a + s.n, 0), ms = ss.reduce((a,s) => a + s.activeMs, 0);
  return n >= 30 ? Math.min(60, Math.max(8, ms / 1000 / n)) : 20;
}
function testPace(test, k = TODAY()){
  const ids = testCards(test);
  const days = daysBetween(k, test.date);
  const unseen = ids.filter(id => !S.progress[id]).length;
  const startedToday = ids.filter(id => S.progress[id]?.introduced === k).length; // tempo liczone od stanu z rana
  const open = ids.filter(id => S.progress[id] && !isMastered(id)).length;
  const lastNew = addDays(test.date, -NEW_LEAD);

  const late = unseen > 0 && introDays === 0;
  const newPerDay = unseen && days > 0 ? Math.ceil((unseen + startedToday) / Math.max(1, introDays || days)) : 0;

  const min = Math.ceil(answersPerDay * secPerAnswer() / 60);
  const level = days <= 0 ? "ok" : (late || newPerDay > 40 || min > 40) ? "bad" : (min > 20 || newPerDay > baseNewLimit()) ? "doing" : "done";

}
function paceTests(k = TODAY()){ return upcomingTests().filter(([,x]) => { const d = daysBetween(k, x.date); return d > 0 && d <= 14; }).map(([id,x]) => [id, x, testPace(x, k)]); }
const PACE_TXT = {bad:"mało czasu", doing:"trzeba przyspieszyć", done:"zdążysz"};
function pacePanel(){
  const rows = paceTests(); if (!rows.length) return "";
  const bySubj = {};
  rows.forEach(([id,x,p]) => { const k = x.subjectId || "?"; (bySubj[k] = bySubj[k] || {min:0, items:[]}); bySubj[k].min += p.min; bySubj[k].items.push([x,p]); });
  const total = Object.values(bySubj).reduce((a,b) => a + b.min, 0);
  const worst = rows.some(r => r[2].level === "bad") ? "bad" : rows.some(r => r[2].level === "doing") ? "doing" : "done";
  const subjRows = Object.entries(bySubj).sort((a,b) => b[1].min - a[1].min).map(([sid,g]) => {
    const s = S.subjects[sid];
    const lines = g.items.map(([x,p]) => {
      const when = `${fmtDate(x.date)} (za ${p.days} ${plural(p.days,"dzień","dni","dni")})`;
      const what = p.unseen
        ? (p.late ? `${p.unseen} nowych kart – na pełne opanowanie jest już za późno, przećwicz je chociaż raz: ${p.newPerDay} dziennie`
                  : `${p.unseen} nowych kart do ${fmtDate(p.lastNew)}: ${p.newPerDay} dziennie`) + (p.open ? ` + ${p.open} do utrwalenia` : "")
        : p.open ? `${p.open} kart do utrwalenia (3 dobre odpowiedzi z rzędu)` : "wszystko opanowane";

function paceNewNeed(){ return paceTests().reduce((a,[,,p]) => a + p.newPerDay, 0); }
function newToday(){ const t = TODAY(); return Object.entries(S.progress).filter(([id,p]) => S.cards[id] && p.introduced === t).length; }
const baseNewLimit = () => Math.max(5, Math.min(20, +S.meta.config?.newPerDay || 15));

  return rows.sort((a,b) => { const ma = isMastered(a[0]), mb = isMastered(b[0]); if (ma !== mb) return ma - mb;
      return ma ? (a[1].due||"").localeCompare(b[1].due||"") || (b[1].lapses||0)-(a[1].lapses||0) : (a[1].at||0)-(b[1].at||0) || runOf(b[1]) - runOf(a[1]); })

function newIds(){

  const tests = upcomingTests().filter(([,x]) => daysBetween(TODAY(), x.date) <= 14).flatMap(([,x]) => x.unitIds||[]);
  const rank = u => { const i = tests.indexOf(u); return i < 0 ? 999 : i; };

function dayHash(k){ let h = 0; for (const ch of k) h = (h * 31 + ch.charCodeAt(0)) >>> 0; return h; }
function hookLine(k = TODAY()){
  const up = upcomingTests().find(([,x]) => { const d = daysBetween(k, x.date); return d >= 0 && d <= 3; });
  if (up){ const [,x] = up; const d = daysBetween(k, x.date); const r = Math.round(readiness(x)*100);
    const subj = S.subjects[x.subjectId]?.name || "";

      : `${d === 1 ? "Jutro" : `Za ${d} dni`}: ${x.title}. Każda runda teraz to mniej stresu na sprawdzianie${r < 50 ? " i realna szansa na lepszą ocenę" : ""}.`; }

const TIERS = [[0.25,"Brąz"],[0.5,"Srebro"],[0.75,"Złoto"],[UNIT_DONE,"Mistrz"]];
function unitTier(st){ let t = null; TIERS.forEach(([p,n]) => { if (st.prog >= p && (n !== "Mistrz" || st.status === "done")) t = n; }); return t; }
function nearestBadge(){
  // najbliższy próg (Brąz 25% / Srebro 50% / Złoto 75% / Mistrz 90%) w rozpoczętych działach
  let best = null;
  Object.keys(S.units).forEach(id => { if (!eligibleUnit(id)) return; const st = unitStats(id); if (!st.total || !st.seen) return;
    const next = TIERS.find(([p]) => st.prog < p);
    if (!next){   // kroki zrobione, ale Mistrz wymaga 90% kart opanowanych
      const need = Math.ceil(st.total * UNIT_DONE) - st.mastered;
      if (need > 0 && (!best || need < best.need)) best = { id, need, st, tier: "Mistrz", target: 1, cards: true }; return; }
    const need = Math.ceil(st.maxLevels * next[0]) - st.levels;
    if (need > 0 && (!best || need < best.need)) best = { id, need, st, tier: next[1], target: next[0] }; });

}

function chart14(){

  let s = `<svg class="chart" viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Minuty nauki w ostatnich 14 dniach">`;
  [0, max/2, max].forEach(v => { s += `<line x1="${L}" x2="${W}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)" stroke-width="1"/><text x="${L-4}" y="${y(v)+3}" text-anchor="end">${v}</text>`; });
  days.forEach((k,i) => {

/* ---------- panel rodzica: oceny z Librusa + sprawdziany + nauka ---------- */
// Ocena liczbowa: 1–6 z plusem/minusem; punkty przeliczone progami procentowymi. "+", "-", "np" nie liczą się do średniej.
function gNum(g){
  if (g.pts != null && g.max) { const p = g.pts / g.max; return p >= .95 ? 6 : p >= .85 ? 5 : p >= .7 ? 4 : p >= .55 ? 3 : p >= .4 ? 2 : 1; }
  const m = String(g.value).trim().match(/^([1-6])([+-]?)$/); if (!m) return null;
  return +m[1] + (m[2] === "+" ? .5 : m[2] === "-" ? -.25 : 0);
}
const gLabel = g => g.pts != null && g.max ? `${String(g.pts).replace(".",",")}/${g.max}` : String(g.value);
const gCls = n => n == null ? "dim" : n < 2 ? "bad" : n < 3 ? "warn" : n >= 4.5 ? "good" : "";
const fmtAvg = n => n == null ? "–" : n.toFixed(2).replace(".",",");
function gradeItems(){ return (S.meta.grades?.items || []).filter(g => g && g.subject); }
function gradeGroups(){
  const by = {};
  gradeItems().forEach(g => { (by[g.subject] = by[g.subject] || { subject: g.subject, subjectId: g.subjectId || null, items: [] }).items.push(g); });
  return Object.values(by).map(x => {
    x.items.sort((a,b) => (a.date||"").localeCompare(b.date||""));
    const num = x.items.map(g => [gNum(g), +g.weight || 1]).filter(([n]) => n != null);
    const w = num.reduce((a,[,wt]) => a + wt, 0);
    x.avg = w ? num.reduce((a,[n,wt]) => a + n*wt, 0) / w : null;
    const last = [...x.items].reverse().find(g => gNum(g) != null);
    x.last = last || null; x.lastNum = last ? gNum(last) : null;
    return x;
  }).sort((a,b) => (a.avg ?? 9) - (b.avg ?? 9));
}
function reviewsBefore(subjectId, date, days = 7){
  if (!subjectId || !date) return 0; const from = addDays(date, -days); let n = 0;
  Object.values(S.progress).forEach(p => { if (p.subjectId === subjectId) (p.hist||[]).forEach(([d]) => { if (d >= from && d < date) n++; }); });
  return n;
}

function gChip(g){
  const n = gNum(g);

}

let NOTE = null;          // szkic nowej notatki (sheet)

let tessP = null;
function loadTess(){
  return tessP || (tessP = new Promise((res, rej) => { const s = document.createElement("script");
    s.src = "https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js";
    s.onload = () => res(window.Tesseract); s.onerror = () => { tessP = null; rej(new Error("ocr-load")); }; document.head.appendChild(s); }));
}
async function ocrBlob(blob, onp){
  const T = await loadTess();
  const w = await T.createWorker("pol", 1, { logger: m => { if (m.status === "recognizing text" && onp) onp(m.progress); } });
  try { const { data } = await w.recognize(blob); return data; } finally { try { await w.terminate(); } catch {} }
}
async function photoPrep(file){
  let src;
  try { src = await createImageBitmap(file); }
  catch { src = await new Promise((res, rej) => { const im = new Image(); im.onload = () => res(im); im.onerror = rej; im.src = URL.createObjectURL(file); }); }
  const W0 = src.width, H0 = src.height, sc = Math.min(1, 2000 / Math.max(W0, H0));
  const c = document.createElement("canvas"); c.width = Math.round(W0 * sc); c.height = Math.round(H0 * sc);
  c.getContext("2d").drawImage(src, 0, 0, c.width, c.height);
  const blob = await new Promise(r => c.toBlob(r, "image/jpeg", 0.85));
  // jakość liczona na małej kopii: jasność i ostrość (wariancja Laplasjanu)
  const s2 = Math.min(1, 400 / Math.max(c.width, c.height)); const m = document.createElement("canvas");
  m.width = Math.max(3, Math.round(c.width * s2)); m.height = Math.max(3, Math.round(c.height * s2));
  const ctx = m.getContext("2d"); ctx.drawImage(c, 0, 0, m.width, m.height);
  const d = ctx.getImageData(0, 0, m.width, m.height).data, W = m.width, H = m.height, g = new Float32Array(W * H);
  let sum = 0, clip = 0; for (let i = 0; i < W * H; i++){ const v = 0.299*d[i*4] + 0.587*d[i*4+1] + 0.114*d[i*4+2]; g[i] = v; sum += v; if (v > 252) clip++; }
  let ls = 0, lq = 0, n = 0;
  for (let y = 1; y < H - 1; y++) for (let x = 1; x < W - 1; x++){ const i = y*W + x; const l = 4*g[i] - g[i-1] - g[i+1] - g[i-W] - g[i+W]; ls += l; lq += l*l; n++; }
  const mean = sum / (W * H), sharp = n ? lq/n - (ls/n)**2 : 0;
  const issues = [];
  if (mean < 70) issues.push("za ciemno"); if (clip / (W * H) > 0.6) issues.push("prześwietlone");
  if (sharp < 60) issues.push("nieostre"); if (Math.max(W0, H0) < 1000) issues.push("mała rozdzielczość");
  return { blob, url: URL.createObjectURL(blob), q: { mean: Math.round(mean), sharp: Math.round(sharp), issues } };
}

// odczyt przez AI (Edge Function read-notebook); null gdy niedostępny
async function aiRead(paths, subjectId){
  try {
    const { data, error } = await sb.functions.invoke("read-notebook", { body: { paths, subject: S.subjects[subjectId]?.name || "", units: unitsOf(subjectId).map(([id,u]) => ({ id, title: u.title })) } });
    if (error || !data?.ok || !data.result) {
      let body = data; try { if (error?.context?.json) body = await error.context.json(); } catch {}
      console.warn("AI", error, body);
      return { err: body?.error || "ai", detail: [body?.detail, body?.model].filter(Boolean).join(" · ") || error?.message || "" }; }
    const r = data.result;
    return { ai: { lessons: (r.lessons || []).slice(0, 10), issues: (r.issues || []).slice(0, 30), cards: (r.cards || []).filter(c => c && c.front && c.back).slice(0, 20),
      unitGuess: r.unitGuess || null, confidence: r.confidence ?? null, unreadable: (r.unreadable || []).slice(0, 20), model: data.model }, text: String(r.text || "") };
  } catch (e){ console.warn(e); return { err: "ai" }; }
}

async function loadPack(){
  const f = $("#pk_file")?.files?.[0]; if (!f){ toast("Wybierz plik od Claude."); return; }
  let pk; try { pk = JSON.parse(await f.text()); } catch { toast("To nie jest poprawny plik paczki."); return; }
  const PACK_COLS = ["cards","units","subjects","tests"];
  const all0 = (pk.docs || []).filter(r => r && r.id && r.data && typeof r.data === "object");
  const badId = all0.filter(r => !SAFE_ID.test(String(r.id))).length; const all = all0.filter(r => SAFE_ID.test(String(r.id)));
  const skippedCol = all.filter(r => !(PACK_COLS.includes(r.col) || (r.col === "meta" && r.id === "grades"))).length;
  let keptEdit = 0;
  const rows = all.filter(r => PACK_COLS.includes(r.col) || (r.col === "meta" && r.id === "grades")).filter(r => {
    if (r.col === "cards" && S.cards[r.id]?.editedAt && !r.merge){ keptEdit++; return false; }   // karta poprawiona w aplikacji: zostaje poprawka
    return true; });
  rows.forEach(r => { if (r.col === "subjects" && S.subjects[r.id]) r.data = { ...r.data, current: S.subjects[r.id].current ?? null }; });   // bieżący dział ustawia rodzic
  if (!rows.length){ toast("Paczka jest pusta."); return; }
  const btn = document.querySelector('[data-act="loadPack"]'); if (btn){ btn.disabled = true; btn.textContent = `Wczytuję ${rows.length}…`; }
  // Bezpiecznik: rekord bez treści (karta bez przodu, dział bez tytułu) zawsze uzupełnia istniejący, nigdy go nie zastępuje.
  rows.forEach(r => { const cur = S[r.col]?.[r.id]; const partial = (r.col === "cards" && !r.data.front) || (r.col === "units" && !r.data.title) || (r.col === "subjects" && !r.data.name);
    if (r.merge || (partial && cur)){ r.data = { ...(cur || {}), ...r.data }; } delete r.merge; });
  const bad = rows.filter(r => (r.col === "cards" && !r.data.front) || (r.col === "units" && !r.data.title));
  if (bad.length){ toast(`Paczka ma ${bad.length} niepełnych elementów bez odpowiednika w bazie. Nic nie wczytano.`); render(); return; }
  try { await store.bulk(rows); rows.forEach(r => { S[r.col] = {...S[r.col], [r.id]: r.data}; }); toast(`Wczytano ${rows.length} ${plural(rows.length,"element","elementy","elementów")}.${keptEdit ? ` Pominięto ${keptEdit} kart poprawionych w aplikacji.` : ""}${skippedCol ? ` Pominięto ${skippedCol} rekordów, których paczka nie może zmieniać (postępy, sesje).` : ""}${badId ? ` Pominięto ${badId} z niedozwolonym id.` : ""}`); }
  catch (e){ console.warn(e); toast("Nie udało się wczytać paczki: " + (e.message || "błąd")); }
  render();
}

}

async function runImport(){
  const sid = $("#i_subj").value; const files = [...($("#i_files")?.files || [])]; const text = $("#i_text").value.trim();
  if (!files.length && !text){ toast("Dodaj zdjęcie albo tekst notatek."); return; }
  importState = { busy:true, subjectId: sid }; render();
  const units = unitsOf(sid).map(([id,u]) => `${id}: ${u.title}`).join("\n") || "(brak działów)";
  const prompt = `Tworzysz fiszki dla ucznia technikum (15 lat). ${files.length ? "Na zdjęciach są notatki z zeszytu" : "Poniżej są notatki z zeszytu"} z przedmiotu: ${S.subjects[sid].name}.
Działy z podręcznika (id: tytuł):
${units}

Zadanie:
1. Wskaż, którego działu dotyczą notatki: podaj unitId z listy. Jeśli żaden nie pasuje, unitId = null i zaproponuj tytuł w newUnitTitle.
2. Utwórz fiszki. Jedna karta = jedna informacja. Typy: "qa" (pytanie i krótka odpowiedź), "cloze" (zdanie z jedną luką w {{podwójnych klamrach}}, np. daty, definicje, wzory; pole back puste), "vocab" (słówko obce → polskie tłumaczenie). Odpowiedzi krótkie. Pisz po polsku, poza słówkami obcymi. Maksymalnie 20 kart.
3. Nie zgaduj. Każdy fragment nieczytelny lub niepewny opisz w "unclear" (gdzie jest i czego dotyczy) i nie twórz z niego karty.
Odpowiedz wyłącznie JSON:
{"unitId":"u_x"|null,"newUnitTitle":null|"...","summary":"jedno zdanie","cards":[{"type":"qa","front":"...","back":"..."}],"unclear":["..."]}${text ? `\n\nNotatki:\n${text.slice(0, 12000)}` : ""}`;
  try {
    const r = await caps.sample.json(prompt, { images: files.length ? files : undefined, modelTier: "default" });
    if (!r || !Array.isArray(r.cards)) throw { code: "invalid_json" };
    r.cards = r.cards.filter(c => c && c.front && ["qa","cloze","vocab"].includes(c.type));
    importState = { subjectId: sid, result: r };
  } catch (e){ importState = { subjectId: sid, error: sampleErr(e) }; }
  render();
}
function sampleErr(e){
  return ({ not_granted:"Nie ma zgody na użycie Claude w tej stronie.", rate_limited:"Za dużo zapytań naraz. Spróbuj za chwilę.", invalid_json:"Claude nie zwrócił poprawnej listy kart. Spróbuj jeszcze raz albo z mniejszą liczbą zdjęć.", images_unavailable:"Wysyłanie zdjęć jest tu niedostępne. Wklej tekst notatek." })[e?.code] || `Nie udało się: ${e?.message || "nieznany błąd"}.`;
}
async function saveImport(){
  const imp = importState; const r = imp.result; const sid = imp.subjectId;
  let unit = $("#ip_unit").value;
  if (unit === "__new"){ const order = unitsOf(sid).length + 1; unit = uid("u"); await store.put("units", unit, { subjectId: sid, title: r.newUnitTitle, order }); }
  let n = 0;
  for (let i = 0; i < r.cards.length; i++){
    if (!$("#ip_on_" + i)?.checked) continue;
    const c = r.cards[i]; const front = $("#ip_f_" + i).value.trim(); const back = ($("#ip_b_" + i)?.value || "").trim();
    if (!front) continue;
    if (c.type === "cloze" && !/\{\{.+?\}\}/.test(front)) continue;
    addCardDocs(sid, unit, c.type, front, back); n++;
  }
  if ($("#ip_current").checked) store.put("subjects", sid, { ...S.subjects[sid], current: unit });
  importState = null; Object.keys(drafts).filter(k => k.startsWith("i_")).forEach(k => delete drafts[k]);
  toast(`Dodano ${n} ${plural(n,"kartę","karty","kart")}.`); render();
}
function addCardDocs(sid, unit, type, front, back, image){
  const base = { unitId: unit, subjectId: sid, created: TODAY() };
  if (type === "vocab"){ const id = uid("c"); store.put("cards", id + "a", { ...base, type, front, back }); store.put("cards", id + "b", { ...base, type, front: back, back: front }); }
  else store.put("cards", uid("c"), { ...base, type, front, back: type === "cloze" ? "" : back, ...(image ? { image } : {}) });
}
async function runTT(){
  const text = $("#tt_text").value.trim(); const file = $("#tt_img")?.files?.[0];
  if (!text && !file){ toast("Wklej tekst terminarza albo dodaj zrzut ekranu."); return; }
  ttImport = { busy:true }; render();
  const subs = sortedSubjects().map(([id,s]) => `${id}: ${s.name}\n${unitsOf(id).map(([uid_,u]) => `   ${uid_}: ${u.title}`).join("\n")}`).join("\n");
  const prompt = `Z terminarza dziennika Librus wypisz sprawdziany, kartkówki i odpowiedzi zapowiedziane na dni od ${TODAY()} wzwyż. Rok szkolny: ${new Date().getFullYear()}.
Przedmioty i działy w aplikacji (id: nazwa):
${subs}
Dopasuj przedmiot (subjectId z listy albo null, wtedy podaj subjectName). Jeśli z opisu wynika zakres, wybierz pasujące unitIds. Nie zgaduj dat: pomiń wpisy bez czytelnej daty.
Odpowiedz wyłącznie JSON: [{"date":"RRRR-MM-DD","subjectId":"s_x"|null,"subjectName":"...","title":"Sprawdzian: ...","unitIds":["u_x"]}]${text ? `\n\nTerminarz:\n${text.slice(0, 12000)}` : ""}`;
  try {
    const r = await caps.sample.json(prompt, { images: file ? [file] : undefined, modelTier: "default" });
    if (!Array.isArray(r)) throw { code:"invalid_json" };
    ttImport = { items: r.filter(x => x && /^\d{4}-\d{2}-\d{2}$/.test(x.date)).map(x => ({ ...x, subjectId: S.subjects[x.subjectId] ? x.subjectId : null, unitIds: (x.unitIds||[]).filter(u => S.units[u]) })) };
  } catch (e){ ttImport = { error: sampleErr(e) }; }
  render();
}
function saveTT(){
  let n = 0;
  ttImport.items.forEach((x,i) => {
    if (!x.subjectId || !$("#tt_on_" + i)?.checked) return;
    const sel = [...($("#tt_u_" + i)?.selectedOptions || [])].map(o => o.value);
    store.put("tests", uid("t"), { subjectId: x.subjectId, title: $("#tt_t_" + i).value.trim() || x.title, date: x.date, unitIds: sel }); n++;
  });
  ttImport = null; toast(`Dodano ${n} ${plural(n,"sprawdzian","sprawdziany","sprawdzianów")}.`); render();
}

if (!window.BORBAN){ document.body.innerHTML = '<div style="font:16px system-ui,sans-serif;max-width:420px;margin:60px auto;padding:20px;border:2px solid #1d2433;border-radius:12px">BorBan działa tylko pod adresem <b>borban.vercel.app</b>. Ten plik służy do wgrania na GitHub, nie do otwierania na komputerze.</div>'; throw new Error("BorBan: brak config.js (otwarty plik lokalnie?)"); }
const sb = supabase.createClient(window.BORBAN.url, window.BORBAN.anonKey, { auth: { persistSession: true, autoRefreshToken: true } });
const fam = { id:null, role:null, name:"", members:[], me:null };
const CHILD_COLS = ["progress","sessions","woop","flags","notes"];
// Kolejka zapisów w telefonie: odpowiedź bez internetu nie ginie, wysyłamy ją przy następnej okazji.
const OUTBOX_KEY = fid => "borban_outbox_" + fid;
function outboxRead(fid){ try { return JSON.parse(localStorage.getItem(OUTBOX_KEY(fid)) || "{}") || {}; } catch { return {}; } }
function outboxWrite(fid, o){ try { localStorage.setItem(OUTBOX_KEY(fid), JSON.stringify(o)); } catch {} }
const SAFE_ID = /^[A-Za-z0-9_.:-]{1,120}$/;   // rekord z innym id (np. wstrzyknięty przez REST) jest pomijany
const stampOf = d => { const v = d?.at ?? d?.editedAt; return v ? (typeof v === "number" ? v : Date.parse(v) || 0) : 0; };
function makeSbStore(fid){
  const q = {}; let warned = 0, parentWarned = false;
  const send = async (k, e) => {
    if (e.del) return sb.from("borban_docs").delete().match({ family_id: fid, col: e.col, id: e.id });
    if (e.retry){   // ponowne wysłanie po braku sieci: nie nadpisuj nowszej wersji z innego urządzenia
      const { data, error } = await sb.from("borban_docs").select("data").match({ family_id: fid, col: e.col, id: e.id }).maybeSingle();
      if (error) return { error };
      if (data?.data && stampOf(data.data) > stampOf(e.data)) return { data: null };
    }
    return sb.from("borban_docs").upsert({ family_id: fid, col: e.col, id: e.id, data: e.data, updated_at: new Date().toISOString() }); };
  const chain = (k, e) => (q[k] = (q[k] || Promise.resolve()).then(() => send(k, e)).then(r => { if (r?.error) throw r.error;
      const o = outboxRead(fid); if (o[k]?.t === e.t){ delete o[k]; outboxWrite(fid, o); } })
    .catch(err => { console.warn(err);
      const perm = err?.code && /^(42501|42P01|23\d{3}|22\d{3}|PGRST1\d\d|PGRST2\d\d)$/.test(err.code) && !/jwt/i.test(err.message||"");
      if (perm && !["progress","sessions"].includes(e.col)){   // trwała odmowa bazy (uprawnienia, zły rekord): ponawianie nic nie da
        const o = outboxRead(fid); if (o[k]?.t === e.t){ delete o[k]; outboxWrite(fid, o); }
        toast(/42501|PGRST301|JWT/i.test(err.code + " " + (err.message||"")) ? "Nie udało się zapisać: brak uprawnień albo wygasło logowanie. Zaloguj się ponownie." : "Nie udało się zapisać zmiany."); return; }
      if (Date.now() - warned > 60000){ warned = Date.now(); toast(perm ? "Odpowiedź czeka w telefonie: baza jej nie przyjęła. Daj znać rodzicowi." : "Brak połączenia: zapisane w telefonie, wyślę, gdy wróci sieć."); } }));
  const enqueue = (col, id, e) => { const k = col + "/" + id; e.t = Date.now() + Math.random(); const o = outboxRead(fid); o[k] = e; outboxWrite(fid, o); return chain(k, e); };
  // podgląd ucznia i konto rodzica: postępy i sesje zostają tylko na ekranie (nie mieszają się z postępami ucznia)
  const localOnly = col => (role.preview && CHILD_COLS.includes(col)) || (fam.role === "parent" && ["progress","sessions"].includes(col));
  return {
    mode:"sb",
    put(col, id, data){ if (data && typeof data === "object" && data.at == null) data = { ...data, at: Date.now() };   // stempel: nowsza wersja wygrywa
      S[col] = {...S[col], [id]: data}; scheduleRender();
      if (localOnly(col)){ if (fam.role === "parent" && !role.preview && !parentWarned){ parentWarned = true; toast("Konto rodzica: odpowiedzi nie zapisują się w postępach ucznia."); } return Promise.resolve(); }
      return enqueue(col, id, { col, id, data }); },
    del(col, id){ const o = {...S[col]}; delete o[id]; S[col] = o; scheduleRender(); if (localOnly(col)) return Promise.resolve();
      return enqueue(col, id, { col, id, del: true }); },
    flush(){ const o = outboxRead(fid); Object.entries(o).forEach(([k, e]) => chain(k, { ...e, retry: true })); return Object.keys(o).length; },
    async bulk(rows){ for (let i = 0; i < rows.length; i += 200){ const { error } = await sb.from("borban_docs").upsert(rows.slice(i, i+200).map(r => ({ family_id: fid, col: r.col, id: r.id, data: r.data, updated_at: new Date().toISOString() }))); if (error) throw error; } }
  };
}
async function loadAll(fid){
  const fresh = Object.fromEntries(COLS.map(c => [c, {}]));
  for (let from = 0; ; from += 1000){
    const { data, error } = await sb.from("borban_docs").select("col,id,data").eq("family_id", fid).range(from, from + 999);
    if (error) throw error;
    data.forEach(r => { if (fresh[r.col] && SAFE_ID.test(r.id) && r.data && typeof r.data === "object") fresh[r.col][r.id] = r.data; });
    if (data.length < 1000) break;
  }
  // niewysłane zapisy z telefonu mają pierwszeństwo, chyba że w bazie jest nowsza wersja (np. z drugiego urządzenia)
  { const o = outboxRead(fid); let changed = false;
    Object.entries(o).forEach(([k, e]) => { if (!fresh[e.col]) return; const srv = fresh[e.col][e.id];
      if (e.del){ delete fresh[e.col][e.id]; return; }
      if (srv && stampOf(srv) > stampOf(e.data)){ delete o[k]; changed = true; return; }   // w bazie jest nowsza wersja: starego wpisu nie wysyłamy
      fresh[e.col][e.id] = e.data; });
    if (changed) outboxWrite(fid, o); }
  // postępy ucznia: nowsza odpowiedź wygrywa (karta otwarta w sesji nie cofa się przez starszy stan z bazy);
  // odpowiedzi z konta rodzica i z podglądu są tylko na ekranie, więc ich nie zachowujemy
  if (fam.role === "child") Object.entries(S.progress || {}).forEach(([id, loc]) => { const srv = fresh.progress[id]; if (srv && stampOf(loc) > stampOf(srv)) fresh.progress[id] = loc; });
  COLS.forEach(c => S[c] = fresh[c]);
}
let reloadTimer = null;
function watch(fid){
  sb.channel("fam-" + fid).on("postgres_changes", { event:"*", schema:"public", table:"borban_docs", filter:"family_id=eq." + fid }, p => {
    const r = p.new && p.new.col ? p.new : p.old; if (!r || !S[r.col] || !SAFE_ID.test(String(r.id))) return;
    if (p.eventType === "DELETE"){ const o = {...S[r.col]}; delete o[r.id]; S[r.col] = o; }
    else { const loc = S[r.col][r.id]; if (r.col === "progress" && fam.role === "child" && loc && stampOf(loc) > stampOf(p.new.data)) return; S[r.col] = {...S[r.col], [r.id]: p.new.data}; }
    if (!SES) scheduleRender();
  }).subscribe();
  const refresh = () => { if (document.visibilityState !== "visible") return; store?.flush?.();
    if (!SES){ loadAll(fid).then(scheduleRender).catch(() => {}); return; }
    // w trakcie rundy: dociągnij tylko postępy kart z kolejki (np. zmienione na drugim urządzeniu)
    const ids = (SES.queue || []).slice(SES.i); if (!ids.length) return;
    sb.from("borban_docs").select("id,data").eq("family_id", fid).eq("col", "progress").in("id", ids.slice(0, 200))
      .then(({ data }) => (data || []).forEach(r => { const loc = S.progress[r.id]; if (!loc || stampOf(r.data) > stampOf(loc)) S.progress = {...S.progress, [r.id]: r.data}; })).catch(() => {}); };
  document.addEventListener("visibilitychange", refresh);
  window.addEventListener("online", () => store?.flush?.());
  clearInterval(reloadTimer); reloadTimer = setInterval(refresh, 120000);
}
function authScreen(msg){
  $("#tabs").innerHTML = ""; $("#hdrCam").hidden = true; $("#hdrBook").hidden = true; $("#hdrStreak").innerHTML = ""; $("#hdrPoints").innerHTML = ""; $("#hdrMenu").hidden = true;
  $("#view").innerHTML = `<div class="stack" style="padding-top:20px">
    <div><p class="eyebrow">BorBan</p><h1>Zaloguj się</h1><p class="small muted">Nauka z fiszkami i plan na każdy dzień.</p></div>
    ${msg ? `<p class="banner">${esc(msg)}</p>` : ""}
    <form class="panel stack" data-form="login">
      <label class="f">E-mail<input type="email" id="l_email" autocomplete="username" required style="width:100%;min-height:44px;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg)"></label>
      <label class="f">Hasło<input type="password" id="l_pass" autocomplete="current-password" required minlength="6" style="width:100%;min-height:44px;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg)"></label>
      <button class="btn primary big" type="submit">Zaloguj</button>
      <button class="btn ghost sm" type="button" data-act="signup">Nie mam konta – załóż</button>
    </form>
    <p class="small muted">Po założeniu konta rodzic dodaje je do rodziny w zakładce „Rodzic”.</p></div>`;
}
async function doLogin(signup){
  const email = $("#l_email")?.value.trim(), password = $("#l_pass")?.value || "";
  if (!email || password.length < 6){ toast("Podaj e-mail i hasło (min. 6 znaków)."); return; }
  const { data, error } = signup ? await sb.auth.signUp({ email, password }) : await sb.auth.signInWithPassword({ email, password });
  if (error){ toast(error.message.includes("Invalid") ? "Zły e-mail lub hasło." : error.message); return; }
  if (signup && !data.session){ authScreen("Konto założone. Potwierdź adres e-mail z wiadomości, którą przyszła, a potem się zaloguj."); return; }
  start();
}
// rodzic: zdjęcia potwierdzonych notatek kasujemy po 30 dniach (tekst zostaje w notatce)
async function removePhotos(id){
  const n = S.notes[id]; if (!n?.photos?.length) return;
  const mine = n.photos.filter(x => typeof x === "string" && x.startsWith(`${fam.id}/${id}/`) && !x.includes(".."));   // tylko pliki tej notatki
  try { if (mine.length){ const { error } = await sb.storage.from("notes").remove(mine); if (error) throw error; }
    store.put("notes", id, { ...S.notes[id], photos: [], photosDeleted: new Date().toISOString() }); }
  catch (e){ console.warn(e); }   // zostają w notatce; spróbujemy przy następnym uruchomieniu
}
async function cleanupPhotos(){
  const lim = Date.now() - 30*86400000;
  const parents = new Set(fam.members.filter(m => m.role === "parent").map(m => m.email).filter(Boolean));
  for (const [id, n] of Object.entries(S.notes)){
    if (!n.photos?.length) continue;
    if (n.status === "rejected" && (!parents.size || parents.has(n.confirmedBy))) await removePhotos(id);
    else if (n.status === "confirmed" && Date.parse(n.confirmedAt) < lim && (!parents.size || parents.has(n.confirmedBy))) await removePhotos(id);
  }
}
async function loadMembers(){
  const { data } = await sb.from("borban_members").select("user_id,role,display_name,email").eq("family_id", fam.id);
  fam.members = data || [];
}
async function start(){
  const { data: { session } } = await sb.auth.getSession();
  if (!session){ authScreen(); return; }
  fam.me = session.user;
  $("#view").innerHTML = `<div class="empty">Ładuję materiał…</div>`;
  const { data: mem, error } = await sb.from("borban_members").select("family_id,role,display_name,borban_families(name)").eq("user_id", session.user.id).limit(1);
  if (error || !mem?.length){ authScreen(`Konto ${session.user.email} nie jest jeszcze dodane do rodziny. Poproś rodzica, żeby dodał je w zakładce „Rodzic”, a potem odśwież stronę.`); $("#hdrMenu").hidden = false; return; }
  fam.id = mem[0].family_id; fam.role = mem[0].role; fam.name = mem[0].borban_families?.name || "";
  role.canEdit = fam.role === "parent"; role.canWrite = true; role.isOwner = role.canEdit; role.preview = false;
  try { await loadAll(fam.id); } catch (e){ console.warn(e); $("#view").innerHTML = `<div class="empty">Nie udało się wczytać danych. Sprawdź internet i odśwież.</div>`; return; }
  store = makeSbStore(fam.id); store.flush();
  if (role.canEdit) loadMembers().then(scheduleRender);
  if (fam.role === "parent") setTimeout(() => loadMembers().then(cleanupPhotos), 8000);
  $("#hdrMenu").hidden = false;
  watch(fam.id);
  render();
}
sb.auth.onAuthStateChange((ev) => { if (ev === "SIGNED_OUT") authScreen(); });
start();
</script>
